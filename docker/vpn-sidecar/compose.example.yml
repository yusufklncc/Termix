# A Fortinet SSL-VPN sidecar, and Termix reaching a network through it.
#
# Copy this next to your own compose file, fill in the environment, and give
# each network its own sidecar. Do not put two VPNs in one container: both push
# a default route, and customer subnets overlap.

services:
  # One of these per network. Name it after the network, not after "vpn".
  vpn-acme:
    image: yusufklncc/termix-vpn-sidecar:latest
    # or, from a source checkout: build: ./vpn-sidecar
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/ppp:/dev/ppp
      # With VPN_CLIENT: openconnect, this one instead of /dev/ppp:
      # - /dev/net/tun:/dev/net/tun
    environment:
      VPN_HOST: vpn.acme.example.com
      VPN_PORT: "443"
      VPN_USER: your.user
      VPN_PASSWORD: your-password
      # openfortivpn prints the gateway's certificate digest when it does not
      # trust it. Paste it here once you have checked it is the right one.
      # VPN_CLIENT: openfortivpn
      # VPN_STRICT_ROUTES: "false"   # only to allow traffic outside the tunnel
      # VPN_TRUSTED_CERT: ""        # openfortivpn: the certificate's digest
      # VPN_TRUSTED_PIN: ""         # openconnect: the public key's, base64
      # VPN_OTP: ""
      # Only needed if the doorway is reachable beyond this Docker network.
      # SOCKS_USER: termix
      # SOCKS_PASSWORD: ""
    networks:
      - termix
    # A dropped tunnel is retried. Until it is back, Termix has nowhere to hand
    # traffic to, and sessions for this network fail instead of leaking.
    restart: unless-stopped
    # No ports: -- the doorway is reachable only from the termix network.

  termix:
    image: yusufklncc/termix:latest
    networks:
      - termix
    # ... your usual Termix configuration

networks:
  termix:

# Then, in Termix's host editor, under "Manage networks", add one:
#   Name:             Acme
#   Gateway address:  vpn-acme     <- the service name above
#   Gateway port:     1080
# and pick it as the "Network" of every host that lives inside Acme.
