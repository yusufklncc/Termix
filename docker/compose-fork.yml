# Run this fork instead of upstream's published build.
#
# docker-compose.yml names ghcr.io/lukegus/termix:latest, which is upstream's
# image and does not contain this fork's work -- deploying it would quietly
# give you a Termix without the direct RDP renderer or the stream protocol.
# This overlay replaces that image and changes nothing else.
#
#   docker compose -f docker-compose.yml -f compose-fork.yml up -d
#
# The Harbor project is public, so this pulls without a login. The GitLab
# registry (registry.fatihk.tr/yusufihsankilinc/termix) holds the same images
# up to 2.9.2-rdp.13, Docker Hub up to 2.9.2-rdp.11, and nothing after it.
#
# To build from a checkout rather than pull, drop this overlay and use
# compose-dev.yml, which builds both the application and the bridge.
#
# Removing the rdp-bridge service and RDP_BRIDGE_URL from docker-compose.yml
# opts out of the direct renderer entirely; hosts stay on the Guacamole path
# either way.
services:
  termix:
    image: harbor.fatihk.tr/flab/termix:latest
