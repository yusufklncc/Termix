services:
  termix-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: termix-dev
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - termix-dev-data:/app/data
    environment:
      PORT: "8080"
      NODE_ENV: development
      RDP_BRIDGE_URL: "rdp-bridge-dev:3390"
      # REDIS_URL: "redis://redis:6379"
      # TERMIX_REDIS_PREFIX: "termix:collab"
      # TERMIX_STEP_CA_REDIS_PREFIX: "termix:step-ca"
    networks:
      - termix-dev-net

  rdp-bridge-dev:
    build:
      context: ./freerdp-bridge
    container_name: rdp-bridge-dev
    restart: unless-stopped
    networks:
      - termix-dev-net
    networks:
      - termix-dev-net

volumes:
  termix-dev-data:
    driver: local

networks:
  termix-dev-net:
    driver: bridge
