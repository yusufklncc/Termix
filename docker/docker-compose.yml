services:
  termix:
    image: ghcr.io/lukegus/termix:latest
    container_name: termix
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - termix-data:/app/data
    environment:
      PORT: "8080"
      GUACD_HOST: "guacd"
      GUACD_TUNNEL_HOST: "termix"
      GUACD_RECORDING_PATH: "/termix-data/session_recordings/guacamole"
      # Trusted reverse-proxy authentication is disabled by default. When
      # enabled, do not expose this container directly to untrusted clients.
      # TRUSTED_PROXY_AUTH_ENABLED: "true"
      # TRUSTED_PROXY_AUTH_TRUSTED_PROXIES: "172.16.0.0/12"
      # TRUSTED_PROXY_AUTH_ROLE_MAP: '{"operators":["user"]}'
      # TRUSTED_PROXY_AUTH_USERNAME_HEADER: "x-forwarded-username"
      # TRUSTED_PROXY_AUTH_ROLE_HEADER: "x-forwarded-role"
      # Optional: only needed for the experimental direct RDP renderer.
      RDP_BRIDGE_URL: "rdp-bridge:3390"
    depends_on:
      - guacd
    networks:
      - termix-net

  # Experimental direct RDP renderer. Remove this service and the RDP_BRIDGE_URL
  # above to opt out entirely -- hosts stay on the Guacamole path either way.
  rdp-bridge:
    # Pulled rather than built: building means building FreeRDP from source.
    # compose-dev.yml builds it from this checkout instead.
    image: yusufklncc/termix-rdp-bridge:latest
    container_name: termix-rdp-bridge
    restart: unless-stopped
    networks:
      - termix-net

  guacd:
    image: guacamole/guacd:1.6.0
    container_name: guacd
    restart: unless-stopped
    volumes:
      - termix-data:/termix-data
    networks:
      - termix-net

volumes:
  termix-data:
    driver: local

networks:
  termix-net:
    driver: bridge
