# Build Termix from this checkout instead of pulling the published image.
#
# docker-compose.yml names ghcr.io/lukegus/termix:latest, which is upstream's
# build and does not contain this fork's work -- deploying it would quietly
# give you a Termix without the direct RDP renderer or the stream protocol.
# This overlay replaces that image with a build of the working tree and
# changes nothing else.
#
#   docker compose -f docker-compose.yml -f compose-fork.yml up -d --build
#
# The rdp-bridge service builds FreeRDP from source, which takes a while the
# first time and is cached afterwards. Removing that service and RDP_BRIDGE_URL
# from docker-compose.yml opts out of the direct renderer entirely; hosts stay
# on the Guacamole path either way.
services:
  termix:
    image: termix:fork
    build:
      context: ..
      dockerfile: docker/Dockerfile
